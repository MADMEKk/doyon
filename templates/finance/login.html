{% extends 'base.html' %}

{% block title %}تسجيل الدخول - نظام إدارة الشراكة{% endblock %}

{% block auth_content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom shadow p-4">
            <div class="text-center mb-4">
                <i class="bi bi-wallet2 text-primary" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2">نظام إدارة الشراكة</h3>
                <p class="text-muted small">تسجيل دخول الشركاء لمتابعة الحسابات والديون</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">اسم المستخدم</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" required autofocus placeholder="اسم المستخدم">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">كلمة المرور</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" required placeholder="كلمة المرور">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> تسجيل الدخول
                </button>

                <div class="text-center mt-3">
                    <span class="text-muted small">ليس لديك حساب؟ </span>
                    <a href="{% url 'finance:register' %}" class="small text-decoration-none fw-bold">إنشاء حساب جديد</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
